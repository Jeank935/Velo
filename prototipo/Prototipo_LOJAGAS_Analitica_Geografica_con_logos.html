;color:var(--muted)}.up{color:var(--green);font-weight:800}.warn{color:#A66C00;font-weight:800}.split{grid-template-columns:minmax(0,1.6fr) minmax(280px,.9fr)}.thirds{grid-template-columns:repeat(3,minmax(0,1fr))}.card-head{padding:18px 20px 13px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.card-head h2,.card-head h3{margin:0;color:var(--navy);font-size:15px}.card-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.card-body{padding:0 20px 20px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:#E8F7F2;color:#137452;font-size:10px;font-weight:800;padding:5px 9px;white-space:nowrap}.pill.amber{background:#FFF4DB;color:#8B5D00}.pill.red{background:#FDECEE;color:#AD303B}.pill.blue{background:#E7F5F8;color:#087C96}.select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;color:#45536D;font-size:11px;max-width:100%}.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:17px}.filter-label{color:var(--muted);font-size:11px;font-weight:750}.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 225px;gap:13px}.map-canvas{position:relative;min-height:370px;background:#EAF1F6;border:1px solid #D9E4EC;border-radius:12px;overflow:hidden}.map-canvas svg{width:100%;height:100%;min-height:370px;display:block}.map-controls{position:absolute;top:12px;left:12px;display:grid;gap:6px}.map-controls button{width:32px;height:32px;border:1px solid #D7E0EA;background:#fff;border-radius:8px;color:var(--navy);font-weight:800;box-shadow:0 3px 9px #1E326418}.map-label{position:absolute;bottom:12px;left:12px;background:#ffffffed;padding:7px 9px;border:1px solid #DDE6EE;border-radius:8px;color:#64748B;font-size:10px}.map-side{display:flex;flex-direction:column;gap:11px}.mini-panel{border:1px solid var(--line);border-radius:11px;padding:13px}.mini-panel h4{margin:0 0 10px;color:var(--navy);font-size:12px}.legend{display:grid;gap:10px}.legend-row{display:flex;align-items:center;gap:8px;color:#56637A;font-size:11px}.legend-dot{width:10px;height:10px;border-radius:50%;background:var(--cyan)}.legend-diamond{width:10px;height:10px;background:var(--yellow);transform:rotate(45deg);margin:0 1px}.legend-square{width:10px;height:10px;background:var(--navy);border-radius:2px}.bar-list{display:grid;gap:14px}.bar-row{display:grid;grid-template-columns:95px minmax(0,1fr) 36px;align-items:center;gap:9px;font-size:11px;color:#5C6880}.bar-track{height:8px;background:#EDF1F7;border-radius:99px;overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:var(--cyan)}.bar-fill.navy{background:var(--navy)}.bar-fill.yellow{background:var(--yellow)}.bar-fill.green{background:#2BA57A}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:#748098;font-size:10px;text-transform:uppercase;letter-spacing:.6px;background:#F8FAFD;font-weight:800}th,td{padding:12px 14px;border-bottom:1px solid #EDF1F6;white-space:nowrap}td{color:#42506A}td b{color:var(--navy)}tr:last-child td{border-bottom:0}.table-actions{color:var(--cyan);font-weight:800;border:0;background:transparent}.section-title{font-size:13px;color:var(--navy);font-weight:800;margin:0 0 13px}.insight{display:flex;gap:11px;padding:13px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px}.insight-icon{width:31px;height:31px;flex:none;border-radius:9px;background:#FFF4DB;color:#966400;display:grid;place-items:center}.insight b{display:block;font-size:12px;color:var(--navy);margin-bottom:3px}.insight p{margin:0;color:var(--muted);font-size:11px}.empty-note{border:1px dashed #C9D5E4;background:#FAFCFE;border-radius:12px;padding:20px;color:var(--muted);font-size:12px}.module-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.module-card{padding:20px;cursor:pointer;transition:.16s;border:1px solid var(--line)}.module-card:hover{transform:translateY(-2px);border-color:#9BD9E5;box-shadow:0 12px 28px #1E326414}.module-number{font-size:11px;font <script>

{key:'m3',n:'03',title:'Gestión de Información Comercial',short:'Información comercial',icon:'▥',desc:'Relacionar ventas, clientes y distribuidores con su ubicación y evolución comercial.',cases:'CU-3.1 · CU-3.2 · CU-3.3'},
{key:'m4',n:'04',title:'Integración y Calidad de Datos',short:'Integración y calidad',icon:'⇄',desc:'Supervisar la entrada de datos de Odoo y asegurar que las ubicaciones sean confiables.',cases:'CU-4.1 · CU-4.2 · CU-4.3'},
{key:'m5',n:'05',title:'Soporte a la Toma de Decisiones',short:'Toma de decisiones',icon:'◈',desc:'Transformar indicadores territoriales en prioridades de expansión y acciones comerciales.',cases:'CU-5.1 · CU-5.2 · CU-5.3'},

];
let current='home'; let activeLayers={clientes:true,distribuidores:true,competencia:true,heat:false};
const content=document.getElementById('content');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function go(key){current=key;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===key));const m=modules.find(x=>x.key===key);document.getElementById('crumb').textContent=m?m.short:(key==='home'?'Vista general':'');document.getElementById('sidebar').classList.remove('open');render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('roleSelect').addEventListener('change',e=>toast('Vista de demostración: perfil seleccionado — '+e.target.value+'. Los permisos reales requieren autenticación de backend.'));
function head(eyebrow,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function kpi(label,value,foot,icon,trend=''){return `<article class="card kpi"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-value">${value}</div><div class="kpi-foot">${trend?`<span class="up">${trend}</span> · `:''}${foot}</div></article>`}
function panel(title,subtitle,body,action=''){return `<section class="card"><div class="card-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${action}</div><div class="card-body">${body}</div></section>`}
function chart(values,labels,alt=false){return `<div class="chart">${values.map((v,i)=>`<div class="chart-col"><div class="chart-bar ${alt&&i%2?'alt':''}" style="height:${v}%"></div><small>${labels[i]}</small></div>`).join('')}</div>`}
function filters(){return `<div class="filters"><span class="filter-label">Filtros</span><select class="select" id="province"><option value="all">Todas las provincias</option><option>Loja</option><option>Zamora Chinchipe</option><option>El Oro</option></select><select class="select" id="canton"><option value="all">Todos los cantones</option><option>Loja</option><option>Catamayo</option><option>Macará</option><option>Calvas</option></select><select class="select" id="period"><option>Últimos 30 días</option><option>Últimos 90 días</option><option>Año actual</option></select><button class="btn" id="applyFilters">Aplicar filtros</button><button class="btn" id="resetFilters">Restablecer</button></div>`}

function moduleCards(){return `${head('Arquitectura funcional','Seis módulos de negocio','La navegación se organiza por capacidades: cada módulo agrupa tareas relacionadas y sus casos de uso asociados.')}<div class="grid module-grid">${modules.map(m=>`<article class="card module-card" data-goto="${m.key}" tabindex="0" role="button" aria-label="Abrir módulo ${m.title}"><div class="module-number">MÓDULO ${m.n}</div><div class="module-icon">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p><div class="module-foot"><span>${m.cases}</span><b>Abrir módulo →</b></div></article>`).join('')}</div><div class="footer-note">La numeración y los nombres siguen los seis módulos de la especificación funcional del proyecto.</div>`}

function m5(){return `${head('Módulo 05','Soporte a la Toma de Decisiones','Compara indicadores y prioriza territorios para orientar expansión y asignación comercial.','<button class="btn primary" id="decisionReport">Generar resumen</button>')}${filters()}<div class="grid kpis">${kpi('Índice de cobertura','76,8%','Indicador demo','◉')}${kpi('Potencial territorial','Alto','Clasificación ilustrativa','✦')}${kpi('Zonas por priorizar','12','Criterio por validar','⌖')}${kpi('Brecha estimada','23,2 pts','Frente al 100% de referencia','↗')}</div><div class="grid split" style="margin-bottom:17px">${panel('Matriz de oportunidades','Comparación ilustrativa por zona',`<div class="table-wrap"><table><thead><tr><th>Territorio</th><th>Cobertura</th><th>Competencia</th><th>Potencial</th><th>Prioridad</th></tr></thead><tbody><tr><td><b>Macará</b></td><td>43%</td><td>Baja</td><td>Alto</td><td><span class="pill red">Alta</span></td></tr><tr><td><b>Calvas</b></td><td>56%</td><td>Media</td><td>Alto</td><td><span class="pill amber">Alta</span></td></tr><tr><td><b>Catamayo</b></td><td>74%</td><td>Alta</td><td>Medio</td><td><span class="pill blue">Media</span></td></tr><tr><td><b>Loja Centro</b></td><td>82%</td><td>Alta</td><td>Medio</td><td><span class="pill">Seguimiento</span></td></tr></tbody></table></div><p style="font-size:10px;color:var(--muted);margin:12px 0 0">Los niveles son ilustrativos. El modelo de priorización debe acordarse con el negocio y documentar sus variables.</p>`) }${panel('Criterios de priorización','Ejemplo de pesos configurables',`<div class="bar-list"><div class="bar-row"><span>Cobertura baja</span><div class="bar-track"><div class="bar-fill navy" style="width:35%"></div></div><b>35%</b></div><div class="bar-row"><span>Demanda</span><div class="bar-track"><div class="bar-fill" style="width:30%"></div></div><b>30%</b></div><div class="bar-row"><span>Competencia</span><div class="bar-track"><div class="bar-fill yellow" style="width:20%"></div></div><b>20%</b></div><div class="bar-row"><span>Accesibilidad</span><div class="bar-track"><div class="bar-fill green" style="width:15%"></div></div><b>15%</b></div></div><button class="btn" id="criteriaBtn" style="margin-top:16px">Configurar criterios</button>`)}</div><div class="grid thirds" style="margin-top:17px">${panel('Hallazgo 01','Cobertura',`<div class="insight"><span class="insight-icon">⌖</span><div><b>Revisar zonas de menor cobertura</b><p>Contrastar registros atendidos con demanda y límites territoriales.</p></div></div>`) }${panel('Hallazgo 02','Distribución',`<div class="insight"><span class="insight-icon">◇</span><div><b>Evaluar áreas de influencia</b><p>Evitar solapamientos y detectar territorios sin distribuidor cercano.</p></div></div>`) }${panel('Hallazgo 03','Competencia',`<div class="insight"><span class="insight-icon">◈</span><div><b>Comparar presencia competitiva</b><p>Interpretar la oportunidad junto con ventas y calidad de datos.</p></div></div>`)}</div>`}
function m6(){return `${head('Módulo 06','Experiencia del Usuario','Ajusta preferencias de visualización y revisa cómo se organizan las funciones por perfil.','<button class="btn primary" id="savePrefs">Guardar preferencias</button>')}<div class="grid split"><div>${panel('Preferencias de visualización','Controles de interfaz para la demostración',`<div class="setting-row"><div><b>Mostrar ayuda contextual</b><small>Explicaciones breves para funciones y filtros</small></div><input type="checkbox" class="toggle" checked></div><div class="setting-row"><div><b>Usar contraste reforzado</b><small>Mayor separación entre elementos de la interfaz</small></div><input type="checkbox" class="toggle"></div><div class="setting-row"><div><b>Mostrar etiquetas junto a los símbolos</b><small>No depender únicamente del color en mapas y gráficos</small></div><input type="checkbox" class="toggle" checked></div><div class="setting-row"><div><b>Reducir animaciones</b><small>Preferencia de movimiento reducido</small></div><input type="checkbox" class="toggle"></div><div class="setting-row"><div><b>Formato de resumen</b><small>Elegir una presentación predeterminada</small></div><select class="select"><option>Dashboard ejecutivo</option><option>Explorador geográfico</option><option>Información comercial</option></select></div>`)}</div><div>${panel('Perfiles de trabajo','Ejemplos de vistas por rol',`<div class="insight"><span class="insight-icon">◈</span><div><b>Gerencia</b><p>Indicadores estratégicos, oportunidades y resúmenes ejecutivos.</p></div></div><div class="insight"><span class="insight-icon">⌖</span><div><b>Jefatura comercial</b><p>Cobertura, distribuidores, brechas y desempeño territorial.</p></div></div><div class="insight"><span class="insight-icon">▥</span><div><b>Analista BI / GIS</b><p>Filtros detallados, capas, validación y análisis espacial.</p></div></div><div class="insight"><span class="insight-icon">⚙</span><div><b>Administrador</b><p>Integración, calidad de datos y configuración de permisos.</p></div></div>`)}</div></div><div style="height:17px"></div>${panel('Accesibilidad y seguridad','Aspectos que deben verificarse antes de producción',`<div class="grid thirds"><div class="mini-panel"><h4>Accesibilidad</h4><p style="font-size:11px;color:var(--muted)">Contraste, foco visible, navegación por teclado, etiquetas y alternativas al color.</p></div><div class="mini-panel"><h4>Autorización</h4><p style="font-size:11px;color:var(--muted)">Los permisos deben validarse en el servidor; cambiar el selector no concede acceso real.</p></div><div class="mini-panel"><h4>Diseño adaptable</h4><p style="font-size:11px;color:var(--muted)">Navegación y paneles deben funcionar en escritorio, tablet y móvil.</p></div></div>`)}`}
function render(){content.innerHTML=current==='home'?home():current==='modules'?moduleCards():current==='m1'?m1():current==='m2'?m2():current==='m3'?m3():current==='m4'?m4():current==='m5'?m5():m6();wire()}
function wire(){
content.querySelectorAll('[data-goto]').forEach(el=>{el.addEventListener('click',()=>go(el.dataset.goto));if(el.tagName==='ARTICLE')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(el.dataset.goto)}})});
content.querySelectorAll('[data-layer]').forEach(el=>el.addEventListener('change',()=>{activeLayers[el.dataset.layer]=el.checked;updateLayers();}));
const apply=document.getElementById('applyFilters');if(apply)apply.onclick=()=>toast('Filtros aplicados en modo demostración. Los datos y KPIs no se recalculan contra una fuente real.');
const reset=document.getElementById('resetFilters');if(reset)reset.onclick=()=>{content.querySelectorAll('.filters select').forEach(s=>s.selectedIndex=0);toast('Filtros restablecidos.')};
const resetL=document.getElementById('resetLayers');if(resetL)resetL.onclick=()=>{activeLayers={clientes:true,distribuidores:true,competencia:true,heat:false};render();toast('Capas restablecidas.')};
content.querySelectorAll('[data-action="heat"]').forEach(b=>b.onclick=()=>{activeLayers.heat=true;activeLayers.clientes=true;updateLayers();toast('Mapa de calor ilustrativo activado.')});
content.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>toast('Detalle de '+b.dataset.zone+': en el producto final se abrirá la ficha de indicadores y registros de la zona.'));
content.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>toast('Revisión de '+b.dataset.review+': flujo de corrección pendiente de conectar con el servicio de geocodificación.'));
const zoomIn=document.getElementById('zoomIn');if(zoomIn)zoomIn.onclick=()=>{const s=content.querySelector('.map-canvas svg');if(s){s.style.transform='scale(1.12)';s.style.transformOrigin='center';toast('Zoom de presentación aplicado al mapa esquemático.')}};
const zoomOut=document.getElementById('zoomOut');if(zoomOut)zoomOut.onclick=()=>{const s=content.querySelector('.map-canvas svg');if(s){s.style.transform='scale(1)';toast('Zoom restablecido.')}};
const center=document.getElementById('centerMap');if(center)center.onclick=()=>{const s=content.querySelector('.map-canvas svg');if(s)s.style.transform='scale(1)';toast('Vista centrada.')};
const zone=document.getElementById('viewZone');if(zone)zone.onclick=()=>toast('Selecciona una zona para consultar sus indicadores; los datos territoriales son ilustrativos.');
['exportM1','exportSales','decisionReport','criteriaBtn','applyCommercial','connectionDetails','savePrefs'].forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=()=>toast(({exportM1:'Resumen territorial de demostración preparado. La exportación real debe conectarse a datos validados.',exportSales:'Reporte de ejemplo preparado. La exportación a CSV/XLSX se implementará en la versión conectada.',decisionReport:'Resumen de oportunidades de ejemplo preparado.',criteriaBtn:'La configuración de pesos requiere acordar y documentar el modelo de priorización.',applyCommercial:'Filtros de demostración aplicados; las cifras no se recalculan con datos reales.',connectionDetails:'La conexión requiere URL de Odoo, autenticación segura, permisos y mapeo de entidades.',savePrefs:'Preferencias simuladas. La persistencia requiere una cuenta de usuario.'})[id])});
const sync=document.getElementById('syncBtn');if(sync)sync.onclick=()=>toast('Simulación: no se ha iniciado ninguna conexión ni sincronización real con Odoo.');
}
function updateLayers(){const ids={clientes:'clientLayer',distribuidores:'distLayer',competencia:'compLayer',heat:'heatLayer'};Object.entries(ids).forEach(([key,id])=>{const el=content.querySelector('#'+id);if(el)el.style.opacity=activeLayers[key]?(key==='heat'?'1':'1'):'0';if(el&&key!=='heat')el.style.display=activeLayers[key]?'':'none'});}
render();
</script>
</body>
</html>
